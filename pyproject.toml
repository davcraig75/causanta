[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "causanta"
version = "0.1.0"
description = "Causal Analysis Using Somatic And Neighborhood Tissue Architecture"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
causanta = "causanta.simulation:main"
