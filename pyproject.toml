[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causanta"
version = "0.2.0"
description = "Causal Analysis Using Somatic And Neighborhood Tissue Architecture"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "numba>=0.58",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
fast = ["numba>=0.58"]  # Optional: ~2x speedup for simulation

[project.scripts]
causanta-simulate = "causanta.simulate.core:main"
causanta-analyze = "causanta.analyze.cli:main"

[tool.setuptools.packages.find]
include = ["causanta*"]
