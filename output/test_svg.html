<!DOCTYPE html>
<html>
<head>
    <title>SVG Shape Test</title>
    <style>
        body { background: #1a1a2e; padding: 20px; }
    </style>
</head>
<body>
    <h2 style="color: white;">SVG Shape Rendering Test</h2>

    <svg width="600" height="400" viewBox="0 0 600 400"
         style="background: #16213e; border-radius: 8px;">
        <defs>
            <!-- Neuron shape (blue) -->
            <symbol id="neuron" viewBox="-1 -1 2 2">
                <path d="M 0 -1 C 0.5 -0.5 0.3 0.2 0.8 1 L 0 0.6 L -0.8 1 C -0.3 0.2 -0.5 -0.5 0 -1 Z"
                      fill="#4477AA" stroke="#222" stroke-width="0.06"/>
            </symbol>

            <!-- Astrocyte shape (cyan) -->
            <symbol id="astrocyte" viewBox="-1 -1 2 2">
                <path d="M 0 -1 L 0.4 -0.3 L 1 -0.2 L 0.4 0.2 L 0.5 1 L 0 0.5 L -0.5 1 L -0.4 0.2 L -1 -0.2 L -0.4 -0.3 Z"
                      fill="#66CCEE" stroke="#222" stroke-width="0.06"/>
            </symbol>

            <!-- Tumor shape (yellow) -->
            <symbol id="tumor" viewBox="-1 -1 2 2">
                <path d="M 0 -0.9 C 0.6 -0.9 0.9 -0.4 0.9 0 C 0.9 0.5 0.5 0.9 0 0.9 C -0.5 0.9 -0.9 0.5 -0.9 0 C -0.9 -0.4 -0.6 -0.9 0 -0.9 Z"
                      fill="#CCBB44" stroke="#222" stroke-width="0.06"/>
            </symbol>

            <!-- Microglia shape (red) -->
            <symbol id="microglia" viewBox="-1 -1 2 2">
                <path d="M 0 -0.6 L 0.3 -0.3 L 0.8 -0.5 L 0.5 0 L 0.8 0.5 L 0.3 0.3 L 0 0.6 L -0.3 0.3 L -0.8 0.5 L -0.5 0 L -0.8 -0.5 L -0.3 -0.3 Z"
                      fill="#EE6677" stroke="#222" stroke-width="0.06"/>
            </symbol>
        </defs>

        <!-- Grid for reference -->
        <g stroke="#333" stroke-width="1" opacity="0.5">
            <line x1="100" y1="0" x2="100" y2="400"/>
            <line x1="200" y1="0" x2="200" y2="400"/>
            <line x1="300" y1="0" x2="300" y2="400"/>
            <line x1="400" y1="0" x2="400" y2="400"/>
            <line x1="500" y1="0" x2="500" y2="400"/>
            <line x1="0" y1="100" x2="600" y2="100"/>
            <line x1="0" y1="200" x2="600" y2="200"/>
            <line x1="0" y1="300" x2="600" y2="300"/>
        </g>

        <!-- Render some cells using the symbols -->
        <use href="#neuron" x="80" y="80" width="40" height="40"/>
        <use href="#neuron" x="150" y="100" width="30" height="30"/>
        <use href="#neuron" x="200" y="70" width="35" height="35" transform="rotate(45 217.5 87.5)"/>

        <use href="#astrocyte" x="280" y="90" width="40" height="40"/>
        <use href="#astrocyte" x="340" y="120" width="30" height="30"/>

        <use href="#tumor" x="80" y="180" width="50" height="50"/>
        <use href="#tumor" x="180" y="200" width="40" height="40"/>
        <use href="#tumor" x="250" y="180" width="35" height="35"/>

        <use href="#microglia" x="350" y="180" width="30" height="30"/>
        <use href="#microglia" x="420" y="200" width="25" height="25"/>
        <use href="#microglia" x="480" y="170" width="35" height="35" transform="rotate(30 497.5 187.5)"/>

        <!-- Labels -->
        <text x="100" y="160" fill="#eee" font-size="14">Neurons</text>
        <text x="300" y="160" fill="#eee" font-size="14">Astrocytes</text>
        <text x="100" y="280" fill="#eee" font-size="14">Tumor</text>
        <text x="380" y="280" fill="#eee" font-size="14">Microglia</text>

        <!-- Scale reference -->
        <rect x="20" y="360" width="100" height="4" fill="#eee"/>
        <text x="70" y="380" fill="#eee" font-size="12" text-anchor="middle">100 um</text>
    </svg>

    <p style="color: #aaa; margin-top: 20px;">
        If you see colored shapes above (neurons, astrocytes, tumor cells, microglia),<br/>
        the SVG rendering is working correctly.
    </p>
</body>
</html>
